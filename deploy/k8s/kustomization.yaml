apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dgi
resources:
  - namespace.yaml
  - pvc.yaml
  - web.yaml
  - service.yaml
  - refresh.yaml
configMapGenerator:
  - name: scoring
    files:
      - scoring.yaml   # deploy.sh copies config/scoring.yaml here; it overrides the copy baked into the image, so the hashed name rolls the pods on a change
images:
  - name: localhost/dgi
    newTag: __IMAGE_TAG__   # deploy.sh substitutes the content-hash tag
labels:
  - pairs:
      app.kubernetes.io/part-of: dgi
