apiVersion: batch/v1
kind: CronJob
metadata:
  name: refresh
spec:
  schedule: "0 7 * * *"
  timeZone: Europe/Bucharest
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: refresh
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              image: localhost/dgi
              imagePullPolicy: Never
              args: ["refresh"]
              env:
                - {name: DGI_INVEST_API_URL, value: "http://api.invest.svc.cluster.local:8750"}
                - {name: DGI_DATA_DIR, value: /data}
                - {name: DGI_SCORING_CONFIG, value: /config/scoring.yaml}
              resources:
                requests: {cpu: 200m, memory: 416Mi}
                limits: {memory: 832Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - {name: cache, mountPath: /data}
                - {name: config, mountPath: /config, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: cache
              persistentVolumeClaim:
                claimName: cache
            - name: config
              configMap:
                name: scoring
            - name: tmp
              emptyDir: {}
